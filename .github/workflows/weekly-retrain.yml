name: Retreino semanal do modelo BTC

# Roda toda segunda-feira as 07:00 UTC (04:00 em Florida no horario de
# verao / 03:00 no horario padrao). Ajuste o cron se quiser outro dia/hora.
# "workflow_dispatch" permite disparar manualmente pela aba Actions do GitHub.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Baixar dados atualizados (Binance, candles de 1m)
        run: python fetch_data.py --days 730 --out data/btcusdt_1m.parquet

      - name: Construir dataset supervisionado (M15)
        run: python build_dataset.py --in data/btcusdt_1m.parquet --out data/dataset_m15.parquet

      - name: Retreinar modelo (walk-forward + calibracao)
        run: python train_walkforward.py --data data/dataset_m15.parquet --payout 0.87 --save-model model.joblib

      - name: Commit e push do modelo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model.joblib report.json
          git diff --cached --quiet && echo "Nada mudou, sem commit." || git commit -m "Retreino semanal automatico $(date -u +'%Y-%m-%d')"
          git push

      - name: Notificar sucesso no Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_retrain.py

      - name: Notificar falha no Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="⚠️ <b>Retreino semanal FALHOU</b>%0AConfira os logs em Actions no GitHub."
          fi
